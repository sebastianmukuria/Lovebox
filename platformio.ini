; Lovebox - PlatformIO Configuration
; https://github.com/julisa99/Lovebox
;
; Build:   pio run
; Upload:  pio run --target upload
; Monitor: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Library dependencies with pinned versions for reproducible builds
lib_deps =
    ; OLED display driver (SSD1306 over I2C)
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    ; WiFiManager - captive portal for WiFi provisioning
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ; JSON parsing for Telegram API responses
    bblanchon/ArduinoJson@^7.3.0
    ; Servo motor control for ESP32 (ESP32 doesn't support the default Servo.h)
    madhephaestus/ESP32Servo@^3.0.6

; Partition scheme with enough space for OTA updates later
board_build.partitions = min_spiffs.csv

; Only build the main firmware (exclude test file)
build_src_filter = +<main.cpp>

; -------------------------------------------------------
; Component test sketch for breadboard practice run
; Flash with:  pio run -e test_components --target upload
; -------------------------------------------------------
[env:test_components]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    madhephaestus/ESP32Servo@^3.0.6
build_src_filter = +<test_components.cpp>
