<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 75" width="60mm" height="75mm">
  <!-- Lovebox Otter - laser cut design
       Intended for 3mm birch plywood.
       The hole at the bottom center is for mounting on the servo horn. -->

  <!-- Otter body outline -->
  <path d="
    M 20,2
    Q 16,2 14,5
    Q 12,8 12,12
    L 12,14
    Q 8,14 6,16
    Q 4,18 4,21
    Q 4,24 6,26
    Q 8,28 12,28
    L 12,30
    Q 10,32 9,35
    Q 8,38 8,42
    L 8,55
    Q 8,60 12,63
    Q 14,65 17,66
    L 17,70
    Q 17,73 20,74
    Q 22,75 25,75
    L 35,75
    Q 38,75 40,74
    Q 43,73 43,70
    L 43,66
    Q 46,65 48,63
    Q 52,60 52,55
    L 52,42
    Q 52,38 51,35
    Q 50,32 48,30
    L 48,28
    Q 52,28 54,26
    Q 56,24 56,21
    Q 56,18 54,16
    Q 52,14 48,14
    L 48,12
    Q 48,8 46,5
    Q 44,2 40,2
    Q 37,2 35,4
    Q 32,6 30,6
    Q 28,6 25,4
    Q 23,2 20,2
    Z
  " fill="#8B6914" stroke="#000" stroke-width="0.5"/>

  <!-- Inner ears -->
  <ellipse cx="17" cy="8" rx="3" ry="4" fill="#D2A45E"/>
  <ellipse cx="43" cy="8" rx="3" ry="4" fill="#D2A45E"/>

  <!-- Face/muzzle area -->
  <ellipse cx="30" cy="22" rx="12" ry="9" fill="#D2B48C"/>

  <!-- Eyes -->
  <circle cx="23" cy="18" r="2.5" fill="#000"/>
  <circle cx="37" cy="18" r="2.5" fill="#000"/>
  <circle cx="24" cy="17" r="0.8" fill="#fff"/>
  <circle cx="38" cy="17" r="0.8" fill="#fff"/>

  <!-- Nose -->
  <ellipse cx="30" cy="22" rx="3" ry="2" fill="#333"/>

  <!-- Mouth -->
  <path d="M 28,24 Q 30,26 32,24" fill="none" stroke="#333" stroke-width="0.5"/>

  <!-- Whiskers -->
  <line x1="20" y1="22" x2="13" y2="20" stroke="#333" stroke-width="0.3"/>
  <line x1="20" y1="23" x2="13" y2="23" stroke="#333" stroke-width="0.3"/>
  <line x1="40" y1="22" x2="47" y2="20" stroke="#333" stroke-width="0.3"/>
  <line x1="40" y1="23" x2="47" y2="23" stroke="#333" stroke-width="0.3"/>

  <!-- Belly -->
  <ellipse cx="30" cy="50" rx="14" ry="16" fill="#D2B48C"/>

  <!-- Arms holding heart -->
  <path d="M 12,35 Q 10,38 14,42 L 20,44" fill="#8B6914" stroke="#000" stroke-width="0.5"/>
  <path d="M 48,35 Q 50,38 46,42 L 40,44" fill="#8B6914" stroke="#000" stroke-width="0.5"/>

  <!-- Heart -->
  <path d="
    M 30,38
    Q 30,34 25,34
    Q 20,34 20,39
    Q 20,44 30,50
    Q 40,44 40,39
    Q 40,34 35,34
    Q 30,34 30,38
    Z
  " fill="#E31C23" stroke="#000" stroke-width="0.5"/>

  <!-- Paws (little bumps at the bottom of arms) -->
  <circle cx="20" cy="44" r="2" fill="#8B6914" stroke="#000" stroke-width="0.3"/>
  <circle cx="40" cy="44" r="2" fill="#8B6914" stroke="#000" stroke-width="0.3"/>

  <!-- Feet -->
  <ellipse cx="22" cy="73" rx="5" ry="2.5" fill="#8B6914" stroke="#000" stroke-width="0.5"/>
  <ellipse cx="38" cy="73" rx="5" ry="2.5" fill="#8B6914" stroke="#000" stroke-width="0.5"/>

  <!-- Servo horn mounting hole (center bottom) -->
  <circle cx="30" cy="68" r="1.5" fill="#fff" stroke="#000" stroke-width="0.3"/>
</svg>
