<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="50mm" height="60mm">
  <!-- Kawaii Otter holding heart - laser cut design
       Style reference: chibi/kawaii with oversized head
       Intended for 3mm birch plywood.
       Servo horn mounting hole at bottom center. -->

  <!-- === BACK LAYER: Tail (behind body) === -->
  <path d="
    M 68,95
    Q 75,93 80,88
    Q 86,82 88,76
    Q 89,72 87,70
    Q 85,68 82,70
    Q 78,73 75,78
    Q 72,84 68,90
    Z
  " fill="#6B4423" stroke="#3B2210" stroke-width="0.8"/>

  <!-- === BODY === -->
  <!-- Main body (small, chibi proportion) -->
  <ellipse cx="50" cy="90" rx="22" ry="22" fill="#7B5B3A" stroke="#3B2210" stroke-width="0.8"/>

  <!-- Belly patch -->
  <ellipse cx="50" cy="92" rx="15" ry="16" fill="#D4B896"/>

  <!-- Feet -->
  <ellipse cx="38" cy="108" rx="8" ry="4" fill="#6B4423" stroke="#3B2210" stroke-width="0.8"/>
  <ellipse cx="62" cy="108" rx="8" ry="4" fill="#6B4423" stroke="#3B2210" stroke-width="0.8"/>

  <!-- === LEFT ARM (behind heart) === -->
  <path d="
    M 30,78
    Q 26,82 28,88
    Q 29,91 33,92
    L 38,88
    Q 34,84 33,78
    Z
  " fill="#7B5B3A" stroke="#3B2210" stroke-width="0.8"/>

  <!-- === RIGHT ARM (behind heart) === -->
  <path d="
    M 70,78
    Q 74,82 72,88
    Q 71,91 67,92
    L 62,88
    Q 66,84 67,78
    Z
  " fill="#7B5B3A" stroke="#3B2210" stroke-width="0.8"/>

  <!-- === HEART === -->
  <path d="
    M 50,78
    C 50,72 42,66 35,72
    C 28,78 30,88 50,98
    C 70,88 72,78 65,72
    C 58,66 50,72 50,78
    Z
  " fill="#E84B5C" stroke="#C13040" stroke-width="0.8"/>
  <!-- Heart shine -->
  <ellipse cx="42" cy="74" rx="3" ry="2" fill="#F08090" opacity="0.6" transform="rotate(-20,42,74)"/>

  <!-- === HEAD (oversized, kawaii proportion) === -->
  <!-- Main head shape -->
  <ellipse cx="50" cy="36" rx="32" ry="30" fill="#7B5B3A" stroke="#3B2210" stroke-width="0.8"/>

  <!-- Hair tuft on top -->
  <path d="
    M 46,7
    Q 48,3 50,6
    Q 52,2 54,7
    Q 53,4 50,5
    Q 47,4 46,7
    Z
  " fill="#6B4423" stroke="#3B2210" stroke-width="0.5"/>

  <!-- Left ear -->
  <ellipse cx="24" cy="18" rx="8" ry="7" fill="#7B5B3A" stroke="#3B2210" stroke-width="0.8"/>
  <ellipse cx="24" cy="18" rx="5" ry="4.5" fill="#C4956A"/>

  <!-- Right ear -->
  <ellipse cx="76" cy="18" rx="8" ry="7" fill="#7B5B3A" stroke="#3B2210" stroke-width="0.8"/>
  <ellipse cx="76" cy="18" rx="5" ry="4.5" fill="#C4956A"/>

  <!-- Face patch (lighter muzzle area) -->
  <path d="
    M 30,35
    Q 30,28 38,25
    Q 44,23 50,23
    Q 56,23 62,25
    Q 70,28 70,35
    Q 70,48 60,52
    Q 55,54 50,54
    Q 45,54 40,52
    Q 30,48 30,35
    Z
  " fill="#E8D5B8"/>

  <!-- Left eye -->
  <ellipse cx="38" cy="34" rx="5.5" ry="6" fill="#1A1A1A"/>
  <ellipse cx="40" cy="32" rx="2" ry="2.2" fill="#fff"/>
  <circle cx="37" cy="36" r="0.8" fill="#fff"/>

  <!-- Right eye -->
  <ellipse cx="62" cy="34" rx="5.5" ry="6" fill="#1A1A1A"/>
  <ellipse cx="64" cy="32" rx="2" ry="2.2" fill="#fff"/>
  <circle cx="61" cy="36" r="0.8" fill="#fff"/>

  <!-- Blush (rosy cheeks) -->
  <ellipse cx="28" cy="40" rx="4" ry="2.5" fill="#E8929A" opacity="0.5"/>
  <ellipse cx="72" cy="40" rx="4" ry="2.5" fill="#E8929A" opacity="0.5"/>

  <!-- Nose -->
  <ellipse cx="50" cy="41" rx="3" ry="2.2" fill="#3B2210"/>

  <!-- Mouth -->
  <path d="M 47,44 Q 50,47 53,44" fill="none" stroke="#3B2210" stroke-width="0.8" stroke-linecap="round"/>

  <!-- === PAWS (on top of heart) === -->
  <!-- Left paw -->
  <ellipse cx="38" cy="82" rx="4" ry="3" fill="#7B5B3A" stroke="#3B2210" stroke-width="0.5"/>
  <!-- Right paw -->
  <ellipse cx="62" cy="82" rx="4" ry="3" fill="#7B5B3A" stroke="#3B2210" stroke-width="0.5"/>

  <!-- === SERVO MOUNTING === -->
  <!-- Servo horn hole (center, behind body) -->
  <circle cx="50" cy="100" r="1.5" fill="#fff" stroke="#3B2210" stroke-width="0.4"/>
</svg>
