<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <style>
    text { font-family: monospace; }
    .title { font-size: 16px; font-weight: bold; fill: #222; }
    .step { font-size: 12px; fill: #222; }
    .coord { font-size: 9px; fill: #666; font-weight: bold; }
    .col-num { font-size: 8px; fill: #888; }
    .row-letter { font-size: 9px; fill: #888; font-weight: bold; }
    .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <text x="450" y="25" text-anchor="middle" class="title">Lovebox Breadboard Wiring - Step by Step</text>

  <!-- ============ BREADBOARD ============ -->
  <rect x="40" y="40" width="820" height="360" rx="6" fill="#E8E4D8" stroke="#AAA" stroke-width="1.5"/>

  <!-- TOP POWER RAIL: + row -->
  <rect x="60" y="52" width="780" height="10" rx="2" fill="#FFD0D0" stroke="#DAA"/>
  <text x="50" y="61" class="row-letter" fill="#E00" text-anchor="end">+</text>
  <!-- TOP POWER RAIL: - row -->
  <rect x="60" y="65" width="780" height="10" rx="2" fill="#D0D0FF" stroke="#AAD"/>
  <text x="50" y="74" class="row-letter" fill="#00E" text-anchor="end">−</text>

  <!-- BOTTOM POWER RAIL: + row -->
  <rect x="60" y="365" width="780" height="10" rx="2" fill="#FFD0D0" stroke="#DAA"/>
  <text x="50" y="374" class="row-letter" fill="#E00" text-anchor="end">+</text>
  <!-- BOTTOM POWER RAIL: - row -->
  <rect x="60" y="378" width="780" height="10" rx="2" fill="#D0D0FF" stroke="#AAD"/>
  <text x="50" y="387" class="row-letter" fill="#00E" text-anchor="end">−</text>

  <!-- Row letters - top section -->
  <text x="52" y="100" class="row-letter">a</text>
  <text x="52" y="120" class="row-letter">b</text>
  <text x="52" y="140" class="row-letter">c</text>
  <text x="52" y="160" class="row-letter">d</text>
  <text x="52" y="180" class="row-letter">e</text>

  <!-- Center gap -->
  <rect x="60" y="190" width="780" height="30" rx="2" fill="#DAD6CA"/>

  <!-- Row letters - bottom section -->
  <text x="52" y="235" class="row-letter">f</text>
  <text x="52" y="255" class="row-letter">g</text>
  <text x="52" y="275" class="row-letter">h</text>
  <text x="52" y="295" class="row-letter">i</text>
  <text x="52" y="315" class="row-letter">j</text>

  <!-- Column numbers -->
  <!-- Each column is 12px apart, starting at x=70 for col 1 -->
  <text x="70" y="92" class="col-num" text-anchor="middle">1</text>
  <text x="82" y="92" class="col-num" text-anchor="middle">2</text>
  <text x="94" y="92" class="col-num" text-anchor="middle">3</text>
  <text x="106" y="92" class="col-num" text-anchor="middle">4</text>
  <text x="118" y="92" class="col-num" text-anchor="middle">5</text>
  <text x="130" y="92" class="col-num" text-anchor="middle">6</text>
  <text x="142" y="92" class="col-num" text-anchor="middle">7</text>
  <text x="154" y="92" class="col-num" text-anchor="middle">8</text>
  <text x="166" y="92" class="col-num" text-anchor="middle">9</text>
  <text x="178" y="92" class="col-num" text-anchor="middle">10</text>
  <text x="190" y="92" class="col-num" text-anchor="middle">11</text>
  <text x="202" y="92" class="col-num" text-anchor="middle">12</text>
  <text x="214" y="92" class="col-num" text-anchor="middle">13</text>
  <text x="226" y="92" class="col-num" text-anchor="middle">14</text>
  <text x="238" y="92" class="col-num" text-anchor="middle">15</text>
  <text x="250" y="92" class="col-num" text-anchor="middle">16</text>
  <text x="262" y="92" class="col-num" text-anchor="middle">17</text>
  <text x="274" y="92" class="col-num" text-anchor="middle">18</text>
  <text x="286" y="92" class="col-num" text-anchor="middle">19</text>
  <text x="298" y="92" class="col-num" text-anchor="middle">20</text>
  <text x="310" y="92" class="col-num" text-anchor="middle">21</text>
  <text x="322" y="92" class="col-num" text-anchor="middle">22</text>
  <text x="334" y="92" class="col-num" text-anchor="middle">23</text>
  <text x="346" y="92" class="col-num" text-anchor="middle">24</text>
  <text x="358" y="92" class="col-num" text-anchor="middle">25</text>
  <text x="370" y="92" class="col-num" text-anchor="middle">26</text>
  <text x="382" y="92" class="col-num" text-anchor="middle">27</text>
  <text x="394" y="92" class="col-num" text-anchor="middle">28</text>
  <text x="406" y="92" class="col-num" text-anchor="middle">29</text>
  <text x="418" y="92" class="col-num" text-anchor="middle">30</text>
  <text x="430" y="92" class="col-num" text-anchor="middle">31</text>
  <text x="442" y="92" class="col-num" text-anchor="middle">32</text>
  <text x="454" y="92" class="col-num" text-anchor="middle">33</text>
  <text x="466" y="92" class="col-num" text-anchor="middle">34</text>
  <text x="478" y="92" class="col-num" text-anchor="middle">35</text>
  <text x="490" y="92" class="col-num" text-anchor="middle">36</text>
  <text x="502" y="92" class="col-num" text-anchor="middle">37</text>
  <text x="514" y="92" class="col-num" text-anchor="middle">38</text>
  <text x="526" y="92" class="col-num" text-anchor="middle">39</text>
  <text x="538" y="92" class="col-num" text-anchor="middle">40</text>

  <!-- Hole dots for a few key columns (showing grid) -->
  <!-- Dots for rows a-e, columns 1-40 (show every 5th to keep clean) -->

  <!-- ============ ESP32 ============ -->
  <!-- ESP32 body: pins in row a (cols 1-15) and row i (cols 1-15) -->
  <!-- USB hangs off the left edge -->
  <rect x="55" y="95" width="190" height="220" rx="4" fill="#1A1A2E" stroke="#555" stroke-width="1.5"/>
  <text x="150" y="200" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="14" font-weight="bold">ESP32</text>
  <text x="150" y="217" text-anchor="middle" fill="#999" font-family="monospace" font-size="9">DevKit</text>

  <!-- USB port hanging off left edge -->
  <rect x="30" y="185" width="35" height="18" rx="3" fill="#888" stroke="#555" stroke-width="1"/>
  <text x="48" y="197" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="7">USB</text>

  <!-- LEFT side pins (row a) - labeled top to bottom = col 1 to col 15 -->
  <!-- These are the actual ESP32 DevKit pins on the left side -->
  <text x="68" y="103" class="coord" text-anchor="middle" fill="#C0A030">3V3</text>
  <text x="82" y="103" class="coord" text-anchor="middle">GND</text>
  <text x="94" y="103" class="coord" text-anchor="middle">D15</text>
  <text x="106" y="103" class="coord" text-anchor="middle">D2</text>
  <text x="118" y="103" class="coord" text-anchor="middle">D4</text>
  <text x="130" y="103" class="coord" text-anchor="middle">RX2</text>
  <text x="142" y="103" class="coord" text-anchor="middle">TX2</text>
  <text x="154" y="103" class="coord" text-anchor="middle">D5</text>
  <text x="166" y="103" class="coord" text-anchor="middle">D18</text>
  <text x="178" y="103" class="coord" text-anchor="middle">D19</text>
  <text x="190" y="103" class="coord" text-anchor="middle" fill="#3070D0">D21</text>
  <text x="202" y="103" class="coord" text-anchor="middle">RX0</text>
  <text x="214" y="103" class="coord" text-anchor="middle">TX0</text>
  <text x="226" y="103" class="coord" text-anchor="middle" fill="#3070D0">D22</text>
  <text x="238" y="103" class="coord" text-anchor="middle">D23</text>

  <!-- Pin dots row a -->
  <circle cx="70" cy="97" r="2.5" fill="#C0A030"/>
  <circle cx="82" cy="97" r="2.5" fill="#555"/>
  <circle cx="94" cy="97" r="2.5" fill="#888"/>
  <circle cx="106" cy="97" r="2.5" fill="#888"/>
  <circle cx="118" cy="97" r="2.5" fill="#888"/>
  <circle cx="130" cy="97" r="2.5" fill="#888"/>
  <circle cx="142" cy="97" r="2.5" fill="#888"/>
  <circle cx="154" cy="97" r="2.5" fill="#888"/>
  <circle cx="166" cy="97" r="2.5" fill="#888"/>
  <circle cx="178" cy="97" r="2.5" fill="#888"/>
  <circle cx="190" cy="97" r="2.5" fill="#3070D0"/>
  <circle cx="202" cy="97" r="2.5" fill="#888"/>
  <circle cx="214" cy="97" r="2.5" fill="#888"/>
  <circle cx="226" cy="97" r="2.5" fill="#3070D0"/>
  <circle cx="238" cy="97" r="2.5" fill="#888"/>

  <!-- RIGHT side pins (row i) - labeled top to bottom = col 1 to col 15 -->
  <text x="68" y="303" class="coord" text-anchor="middle" fill="#C04040">VIN</text>
  <text x="82" y="303" class="coord" text-anchor="middle">GND</text>
  <text x="94" y="303" class="coord" text-anchor="middle" fill="#E07020">D13</text>
  <text x="106" y="303" class="coord" text-anchor="middle">D12</text>
  <text x="118" y="303" class="coord" text-anchor="middle">D14</text>
  <text x="130" y="303" class="coord" text-anchor="middle">D27</text>
  <text x="142" y="303" class="coord" text-anchor="middle">D26</text>
  <text x="154" y="303" class="coord" text-anchor="middle">D25</text>
  <text x="166" y="303" class="coord" text-anchor="middle">D33</text>
  <text x="178" y="303" class="coord" text-anchor="middle">D32</text>
  <text x="190" y="303" class="coord" text-anchor="middle">D35</text>
  <text x="202" y="303" class="coord" text-anchor="middle" fill="#30A040">D34</text>
  <text x="214" y="303" class="coord" text-anchor="middle">VN</text>
  <text x="226" y="303" class="coord" text-anchor="middle">VP</text>
  <text x="238" y="303" class="coord" text-anchor="middle">EN</text>

  <!-- Pin dots row i -->
  <circle cx="70" cy="293" r="2.5" fill="#C04040"/>
  <circle cx="82" cy="293" r="2.5" fill="#555"/>
  <circle cx="94" cy="293" r="2.5" fill="#E07020"/>
  <circle cx="106" cy="293" r="2.5" fill="#888"/>
  <circle cx="118" cy="293" r="2.5" fill="#888"/>
  <circle cx="130" cy="293" r="2.5" fill="#888"/>
  <circle cx="142" cy="293" r="2.5" fill="#888"/>
  <circle cx="154" cy="293" r="2.5" fill="#888"/>
  <circle cx="166" cy="293" r="2.5" fill="#888"/>
  <circle cx="178" cy="293" r="2.5" fill="#888"/>
  <circle cx="190" cy="293" r="2.5" fill="#888"/>
  <circle cx="202" cy="293" r="2.5" fill="#30A040"/>
  <circle cx="214" cy="293" r="2.5" fill="#888"/>
  <circle cx="226" cy="293" r="2.5" fill="#888"/>
  <circle cx="238" cy="293" r="2.5" fill="#888"/>

  <!-- ============ OLED DISPLAY ============ -->
  <rect x="370" y="95" width="90" height="65" rx="3" fill="#222" stroke="#555" stroke-width="1"/>
  <rect x="378" y="102" width="74" height="35" rx="2" fill="#000"/>
  <text x="415" y="122" text-anchor="middle" fill="#0FF" font-family="monospace" font-size="9">OLED</text>
  <!-- OLED pins in row a at columns 26,27,28,29 -->
  <circle cx="382" cy="97" r="2.5" fill="#C0A030"/>
  <circle cx="394" cy="97" r="2.5" fill="#555"/>
  <circle cx="406" cy="97" r="2.5" fill="#3070D0"/>
  <circle cx="418" cy="97" r="2.5" fill="#D0A020"/>
  <text x="382" y="88" class="coord" text-anchor="middle">VCC</text>
  <text x="394" y="88" class="coord" text-anchor="middle">GND</text>
  <text x="406" y="88" class="coord" text-anchor="middle">SDA</text>
  <text x="418" y="88" class="coord" text-anchor="middle">SCL</text>
  <text x="382" y="82" class="col-num" text-anchor="middle">c26</text>
  <text x="394" y="82" class="col-num" text-anchor="middle">c27</text>
  <text x="406" y="82" class="col-num" text-anchor="middle">c28</text>
  <text x="418" y="82" class="col-num" text-anchor="middle">c29</text>

  <!-- ============ WIRES ============ -->

  <!-- WIRE 1: 3V3 (b1) → OLED VCC (b26) — RED -->
  <path d="M 70,117 L 70,125 L 382,125 L 382,117" class="wire" stroke="#E03030"/>
  <text x="220" y="135" text-anchor="middle" fill="#E03030" font-family="monospace" font-size="8">WIRE 1: b1 → b26 (red)</text>

  <!-- WIRE 2: GND (b2) → OLED GND (b27) — BLACK -->
  <path d="M 82,117 L 82,143 L 394,143 L 394,117" class="wire" stroke="#333"/>
  <text x="230" y="153" text-anchor="middle" fill="#333" font-family="monospace" font-size="8">WIRE 2: b2 → b27 (black)</text>

  <!-- WIRE 3: D21 (b11) → OLED SDA (b28) — BLUE -->
  <path d="M 190,117 L 190,161 L 406,161 L 406,117" class="wire" stroke="#3070D0"/>
  <text x="298" y="171" text-anchor="middle" fill="#3070D0" font-family="monospace" font-size="8">WIRE 3: b11 → b28 (blue)</text>

  <!-- WIRE 4: D22 (b14) → OLED SCL (b29) — YELLOW -->
  <path d="M 226,117 L 226,179 L 418,179 L 418,117" class="wire" stroke="#C8A020"/>
  <text x="322" y="189" text-anchor="middle" fill="#C8A020" font-family="monospace" font-size="8">WIRE 4: b14 → b29 (yellow)</text>

  <!-- WIRE 5: VIN (j1) → Servo Red — RED -->
  <path d="M 70,313 L 70,340 L 500,340" class="wire" stroke="#E03030"/>

  <!-- WIRE 6: GND (j2) → Servo Brown — BLACK -->
  <path d="M 82,313 L 82,355 L 500,355" class="wire" stroke="#333"/>

  <!-- WIRE 7: D13 (j3) → Servo Orange — ORANGE -->
  <path d="M 94,313 L 94,325 L 500,325" class="wire" stroke="#E07020"/>

  <!-- ============ SERVO ============ -->
  <rect x="500" y="310" width="100" height="55" rx="4" fill="#4A4A4A" stroke="#333" stroke-width="1.5"/>
  <text x="550" y="335" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="10" font-weight="bold">SERVO</text>
  <text x="550" y="352" text-anchor="middle" fill="#E07020" font-family="monospace" font-size="8">Orange = signal</text>
  <text x="550" y="362" text-anchor="middle" fill="#CCC" font-family="monospace" font-size="8">Red=5V  Brown=GND</text>
  <text x="500" y="328" text-anchor="end" fill="#E07020" font-family="monospace" font-size="8">j3 →</text>
  <text x="500" y="343" text-anchor="end" fill="#E03030" font-family="monospace" font-size="8">j1 →</text>
  <text x="500" y="358" text-anchor="end" fill="#333" font-family="monospace" font-size="8">j2 →</text>

  <!-- ============ LDR + RESISTOR ============ -->

  <!-- Resistor: one leg in b1 area (3V3 row), other leg at column 20 -->
  <!-- Actually let's put resistor legs at e20 and e24 -->
  <rect x="430" y="255" width="70" height="14" rx="3" fill="#E8D8A0" stroke="#AA8" stroke-width="1"/>
  <rect x="442" y="255" width="4" height="14" fill="#8B4513"/>
  <rect x="450" y="255" width="4" height="14" fill="#000"/>
  <rect x="458" y="255" width="4" height="14" fill="#E07020"/>
  <rect x="470" y="255" width="4" height="14" fill="#C0A030"/>
  <text x="465" y="252" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">10kΩ resistor</text>

  <!-- LDR -->
  <circle cx="530" cy="293" r="16" fill="#C8B880" stroke="#AA8" stroke-width="1.5"/>
  <text x="530" y="297" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#555">LDR</text>

  <!-- WIRE 8: 3V3 rail → resistor leg 1 -->
  <!-- Connect 3V3 from b1 area down to resistor -->
  <path d="M 70,125 L 70,57 L 430,57 L 430,262" class="wire" stroke="#E03030"/>
  <text x="250" y="53" text-anchor="middle" fill="#E03030" font-family="monospace" font-size="8">WIRE 8: top + rail → resistor</text>

  <!-- Junction point between resistor and LDR -->
  <circle cx="510" cy="280" r="5" fill="#30A040"/>

  <!-- Resistor to junction -->
  <line x1="500" y1="262" x2="510" y2="280" class="wire" stroke="#30A040"/>

  <!-- LDR leg 1 to junction -->
  <line x1="520" y1="278" x2="510" y2="280" class="wire" stroke="#30A040"/>

  <!-- WIRE 9: Junction → D34 (j12) — GREEN -->
  <path d="M 510,280 L 510,293 L 202,293" class="wire" stroke="#30A040"/>
  <text x="356" y="288" text-anchor="middle" fill="#30A040" font-family="monospace" font-size="8">WIRE 9: junction → j12 / D34 (green)</text>

  <!-- WIRE 10: LDR other leg → GND rail — BLACK -->
  <path d="M 540,293 L 540,387" class="wire" stroke="#333"/>
  <text x="560" y="393" fill="#333" font-family="monospace" font-size="8">→ bottom − rail</text>

  <!-- GND rail connection: GND (j2) to bottom - rail -->
  <path d="M 82,355 L 82,387" class="wire" stroke="#333" stroke-dasharray="4,3"/>
  <text x="92" y="397" fill="#333" font-family="monospace" font-size="7">GND to − rail</text>

  <!-- 3V3 to top + rail -->
  <path d="M 70,125 L 70,62" class="wire" stroke="#E03030" stroke-dasharray="4,3"/>

  <!-- ============ STEP BY STEP INSTRUCTIONS ============ -->
  <rect x="40" y="420" width="820" height="220" rx="6" fill="#F8F6F0" stroke="#CCC" stroke-width="1"/>
  <text x="60" y="445" class="title">Step-by-Step Wiring Instructions</text>

  <text x="60" y="468" class="step" font-weight="bold">1. Place ESP32</text>
  <text x="80" y="483" class="step" fill="#555">Push ESP32 into breadboard with USB port hanging off the LEFT edge.</text>
  <text x="80" y="496" class="step" fill="#555">Left pins go in row a (columns 1-15). Right pins go in row i (columns 1-15).</text>

  <text x="60" y="516" class="step" font-weight="bold">2. OLED Display (4 wires)</text>
  <text x="80" y="531" class="step"><tspan fill="#E03030">RED wire:   b1 → b26</tspan>  (3V3 → OLED VCC)</text>
  <text x="80" y="544" class="step"><tspan fill="#333">BLACK wire: b2 → b27</tspan>  (GND → OLED GND)</text>
  <text x="80" y="557" class="step"><tspan fill="#3070D0">BLUE wire:  b11 → b28</tspan> (D21 → OLED SDA)</text>
  <text x="80" y="570" class="step"><tspan fill="#C8A020">YELLOW wire: b14 → b29</tspan> (D22 → OLED SCL)</text>

  <text x="450" y="468" class="step" font-weight="bold">3. Servo (3 wires from servo plug)</text>
  <text x="470" y="483" class="step"><tspan fill="#E07020">Orange wire → j3</tspan>  (signal → D13)</text>
  <text x="470" y="496" class="step"><tspan fill="#E03030">Red wire → j1</tspan>     (power → VIN/5V)</text>
  <text x="470" y="509" class="step"><tspan fill="#333">Brown wire → j2</tspan>    (ground → GND)</text>

  <text x="450" y="532" class="step" font-weight="bold">4. LDR + Resistor (3 wires + 2 parts)</text>
  <text x="470" y="547" class="step" fill="#555">Resistor: one leg in top + rail, other in e30</text>
  <text x="470" y="560" class="step" fill="#555">LDR: one leg in e30, other in bottom − rail</text>
  <text x="470" y="573" class="step"><tspan fill="#30A040">GREEN wire: e30 → j12</tspan> (junction → D34)</text>
  <text x="470" y="586" class="step" fill="#555">Wire top + rail to b1 (3V3)</text>
  <text x="470" y="599" class="step" fill="#555">Wire bottom − rail to j2 (GND)</text>

  <text x="60" y="625" class="step" font-weight="bold" fill="#E03030">5. Plug USB-C cable into ESP32 and your computer. Tell me when ready!</text>
</svg>
