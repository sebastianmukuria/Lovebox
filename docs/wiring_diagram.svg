<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <style>
    text { font-family: monospace; font-size: 11px; fill: #333; }
    .label { font-size: 10px; font-weight: bold; }
    .pin-label { font-size: 8px; fill: #555; }
    .title { font-size: 16px; font-weight: bold; fill: #222; }
    .subtitle { font-size: 11px; fill: #666; }
    .wire { fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .wire-red { stroke: #E03030; }
    .wire-black { stroke: #222; }
    .wire-blue { stroke: #3070D0; }
    .wire-yellow { stroke: #D0A020; }
    .wire-orange { stroke: #E07020; }
    .wire-green { stroke: #30A040; }
    .wire-purple { stroke: #8040C0; }
  </style>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" class="title">Lovebox Breadboard Wiring Diagram</text>
  <text x="350" y="42" text-anchor="middle" class="subtitle">ESP32 DevKit + SSD1306 OLED + Servo + LDR</text>

  <!-- ============ BREADBOARD ============ -->
  <rect x="50" y="60" width="600" height="380" rx="8" fill="#E8E4D8" stroke="#AAA" stroke-width="1.5"/>

  <!-- Power rails top -->
  <rect x="70" y="75" width="560" height="12" rx="2" fill="#FFE0E0" stroke="#C99" stroke-width="0.5"/>
  <text x="64" y="84" class="pin-label" fill="#E03030" text-anchor="end">+</text>
  <rect x="70" y="90" width="560" height="12" rx="2" fill="#E0E0FF" stroke="#99C" stroke-width="0.5"/>
  <text x="64" y="99" class="pin-label" fill="#3070D0" text-anchor="end">−</text>

  <!-- Power rails bottom -->
  <rect x="70" y="385" width="560" height="12" rx="2" fill="#FFE0E0" stroke="#C99" stroke-width="0.5"/>
  <text x="64" y="394" class="pin-label" fill="#E03030" text-anchor="end">+</text>
  <rect x="70" y="400" width="560" height="12" rx="2" fill="#E0E0FF" stroke="#99C" stroke-width="0.5"/>
  <text x="64" y="409" class="pin-label" fill="#3070D0" text-anchor="end">−</text>

  <!-- Row labels -->
  <text x="76" y="130" class="pin-label">a</text>
  <text x="76" y="150" class="pin-label">b</text>
  <text x="76" y="170" class="pin-label">c</text>
  <text x="76" y="190" class="pin-label">d</text>
  <text x="76" y="210" class="pin-label">e</text>
  <text x="76" y="280" class="pin-label">f</text>
  <text x="76" y="300" class="pin-label">g</text>
  <text x="76" y="320" class="pin-label">h</text>
  <text x="76" y="340" class="pin-label">i</text>
  <text x="76" y="360" class="pin-label">j</text>

  <!-- Center divider -->
  <rect x="70" y="222" width="560" height="46" rx="3" fill="#D8D4C8" stroke="#BBB" stroke-width="0.5"/>
  <text x="350" y="249" text-anchor="middle" class="pin-label" fill="#888">center gap</text>

  <!-- ============ ESP32 ============ -->
  <!-- ESP32 body straddling center gap -->
  <rect x="180" y="130" width="80" height="240" rx="4" fill="#1A1A2E" stroke="#444" stroke-width="1.5"/>
  <text x="220" y="155" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="10" font-weight="bold">ESP32</text>
  <text x="220" y="168" text-anchor="middle" fill="#AAA" font-family="monospace" font-size="8">DevKit</text>

  <!-- USB port -->
  <rect x="205" y="125" width="30" height="12" rx="2" fill="#888" stroke="#555" stroke-width="1"/>
  <text x="220" y="121" text-anchor="middle" class="pin-label" fill="#888">USB-C</text>

  <!-- ESP32 Left pins (top to bottom) -->
  <circle cx="185" cy="185" r="3" fill="#C0A030"/>
  <text x="175" y="188" text-anchor="end" class="pin-label" font-weight="bold">3V3</text>

  <circle cx="185" cy="205" r="3" fill="#555"/>
  <text x="175" y="208" text-anchor="end" class="pin-label" font-weight="bold">GND</text>

  <circle cx="185" cy="270" r="3" fill="#5090D0"/>
  <text x="175" y="273" text-anchor="end" class="pin-label" font-weight="bold">G21</text>

  <circle cx="185" cy="290" r="3" fill="#5090D0"/>
  <text x="175" y="293" text-anchor="end" class="pin-label" font-weight="bold">G22</text>

  <circle cx="185" cy="330" r="3" fill="#5090D0"/>
  <text x="175" y="333" text-anchor="end" class="pin-label" font-weight="bold">G34</text>

  <!-- ESP32 Right pins -->
  <circle cx="255" cy="185" r="3" fill="#C04040"/>
  <text x="265" y="188" class="pin-label" font-weight="bold">VIN</text>

  <circle cx="255" cy="205" r="3" fill="#555"/>
  <text x="265" y="208" class="pin-label" font-weight="bold">GND</text>

  <circle cx="255" cy="290" r="3" fill="#5090D0"/>
  <text x="265" y="293" class="pin-label" font-weight="bold">G13</text>

  <!-- ============ OLED DISPLAY ============ -->
  <rect x="380" y="120" width="100" height="80" rx="4" fill="#222" stroke="#555" stroke-width="1.5"/>
  <rect x="390" y="130" width="80" height="45" rx="2" fill="#000" stroke="#333" stroke-width="1"/>
  <text x="430" y="155" text-anchor="middle" fill="#0FF" font-family="monospace" font-size="8">OLED</text>
  <text x="430" y="165" text-anchor="middle" fill="#0FF" font-family="monospace" font-size="7">128x64</text>

  <!-- OLED pins -->
  <circle cx="395" cy="210" r="3" fill="#C0A030"/>
  <text x="395" y="225" text-anchor="middle" class="pin-label">VCC</text>
  <circle cx="415" cy="210" r="3" fill="#555"/>
  <text x="415" y="225" text-anchor="middle" class="pin-label">GND</text>
  <circle cx="435" cy="210" r="3" fill="#5090D0"/>
  <text x="435" y="225" text-anchor="middle" class="pin-label">SDA</text>
  <circle cx="455" cy="210" r="3" fill="#5090D0"/>
  <text x="455" y="225" text-anchor="middle" class="pin-label">SCL</text>

  <!-- OLED Wires -->
  <!-- VCC (3V3) - Red -->
  <path d="M 185,185 L 130,185 L 130,81 L 395,81 L 395,210" class="wire wire-red"/>
  <!-- GND - Black -->
  <path d="M 185,205 L 120,205 L 120,96 L 415,96 L 415,210" class="wire wire-black"/>
  <!-- SDA (G21) - Blue -->
  <path d="M 185,270 L 140,270 L 140,240 L 435,240 L 435,210" class="wire wire-blue"/>
  <!-- SCL (G22) - Yellow -->
  <path d="M 185,290 L 150,290 L 150,250 L 455,250 L 455,210" class="wire wire-yellow"/>

  <!-- ============ SERVO ============ -->
  <rect x="340" y="310" width="90" height="55" rx="4" fill="#4A4A4A" stroke="#333" stroke-width="1.5"/>
  <text x="385" y="332" text-anchor="middle" fill="#FFF" font-family="monospace" font-size="9" font-weight="bold">SERVO</text>
  <text x="385" y="345" text-anchor="middle" fill="#CCC" font-family="monospace" font-size="7">MG995/SG90</text>

  <!-- Servo wires coming out -->
  <circle cx="355" cy="370" r="3" fill="#E03030"/>
  <text x="355" y="383" text-anchor="middle" class="pin-label" fill="#E03030">Red</text>
  <circle cx="385" cy="370" r="3" fill="#8B4513"/>
  <text x="385" y="383" text-anchor="middle" class="pin-label" fill="#8B4513">Brown</text>
  <circle cx="415" cy="370" r="3" fill="#E07020"/>
  <text x="415" y="383" text-anchor="middle" class="pin-label" fill="#E07020">Orange</text>

  <!-- Servo Wires -->
  <!-- VIN → Servo Red (power) -->
  <path d="M 255,185 L 290,185 L 290,391 L 355,391 L 355,370" class="wire wire-red"/>
  <!-- GND → Servo Brown -->
  <path d="M 255,205 L 300,205 L 300,406 L 385,406 L 385,370" class="wire wire-black"/>
  <!-- G13 → Servo Orange (signal) -->
  <path d="M 255,290 L 310,290 L 310,350 L 415,350 L 415,370" class="wire wire-orange"/>

  <!-- ============ LDR + RESISTOR ============ -->
  <!-- Resistor symbol -->
  <rect x="510" y="280" width="60" height="16" rx="3" fill="#E8D8A0" stroke="#AA8" stroke-width="1"/>
  <text x="540" y="292" text-anchor="middle" font-family="monospace" font-size="7" fill="#555">10kΩ</text>
  <!-- Resistor color bands -->
  <rect x="520" y="280" width="3" height="16" fill="#8B4513"/>
  <rect x="527" y="280" width="3" height="16" fill="#000"/>
  <rect x="534" y="280" width="3" height="16" fill="#E07020"/>
  <rect x="545" y="280" width="3" height="16" fill="#C0A030"/>

  <!-- LDR symbol -->
  <circle cx="540" cy="340" r="14" fill="#C8B880" stroke="#AA8" stroke-width="1.5"/>
  <text x="540" y="344" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#555">LDR</text>
  <!-- Light arrows -->
  <line x1="560" y1="325" x2="568" y2="317" stroke="#DA0" stroke-width="1.5"/>
  <polygon points="568,317 562,320 565,323" fill="#DA0"/>
  <line x1="564" y1="332" x2="572" y2="324" stroke="#DA0" stroke-width="1.5"/>
  <polygon points="572,324 566,327 569,330" fill="#DA0"/>

  <!-- Wires for LDR circuit -->
  <!-- 3V3 → top of resistor (via power rail) -->
  <path d="M 510,288 L 500,288 L 500,81 " class="wire wire-red"/>
  <!-- Bottom of resistor → junction → G34 -->
  <path d="M 570,288 L 590,288 L 590,330 L 185,330" class="wire wire-green"/>
  <!-- Junction to LDR top -->
  <line x1="540" y1="296" x2="540" y2="326" class="wire wire-green"/>
  <!-- Junction dot -->
  <circle cx="540" cy="310" r="4" fill="#30A040"/>
  <text x="556" y="313" class="pin-label" fill="#30A040" font-weight="bold">→ G34</text>
  <!-- LDR bottom → GND (via power rail) -->
  <path d="M 540,354 L 540,406" class="wire wire-black"/>

  <!-- ============ LEGEND ============ -->
  <rect x="50" y="448" width="600" height="42" rx="4" fill="#F5F3ED" stroke="#CCC" stroke-width="0.5"/>
  <text x="65" y="464" class="label">Wire Colors:</text>
  <line x1="140" y1="460" x2="160" y2="460" class="wire wire-red"/>
  <text x="165" y="464" class="pin-label">3V3 / VIN Power</text>
  <line x1="255" y1="460" x2="275" y2="460" class="wire wire-black"/>
  <text x="280" y="464" class="pin-label">GND</text>
  <line x1="315" y1="460" x2="335" y2="460" class="wire wire-blue"/>
  <text x="340" y="464" class="pin-label">SDA (G21)</text>
  <line x1="410" y1="460" x2="430" y2="460" class="wire wire-yellow"/>
  <text x="435" y="464" class="pin-label">SCL (G22)</text>
  <line x1="500" y1="460" x2="520" y2="460" class="wire wire-orange"/>
  <text x="525" y="464" class="pin-label">Servo Signal (G13)</text>

  <text x="65" y="482" class="pin-label" fill="#30A040" font-weight="bold">Green = LDR voltage divider junction (G34).</text>
  <text x="310" y="482" class="pin-label">LDR detects light when box is opened. Resistor + LDR form a voltage divider read by GPIO 34.</text>
</svg>
